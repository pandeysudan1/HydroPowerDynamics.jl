name: FREKI Objective 5 online monitor

on:
  push:
    branches: [AGC_Trollheim]
    paths:
      - 'quick_examples/freki_objectives/objective_05_online_monitor.jl'
      - 'quick_examples/freki_objectives/results/objective_01b_summary.csv'
      - 'quick_examples/freki_objectives/results/objective_02_summary.csv'
      - 'quick_examples/trollheim_experimental/01_preprocessing/trollheim_processed.csv'
      - '.github/workflows/freki-objective-05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - uses: julia-actions/cache@v2

      - name: Instantiate environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run FREKI Objective 5
        run: julia --project=. quick_examples/freki_objectives/objective_05_online_monitor.jl

      - name: Verify outputs
        run: |
          test -f quick_examples/freki_objectives/results/objective_05_summary.csv
          test -f quick_examples/freki_objectives/results/objective_05_online_timeseries.csv
          test -f quick_examples/freki_objectives/plots/05_01_online_power_prediction.png
          test -f quick_examples/freki_objectives/plots/05_02_rolling_residuals.png
          test -f quick_examples/freki_objectives/plots/05_03_model_health.png
          test -f quick_examples/freki_objectives/plots/05_04_online_fcr_capacity.png
          test -f quick_examples/freki_objectives/plots/05_05_health_occupancy.png

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: freki-objective-05
          path: |
            quick_examples/freki_objectives/results/objective_05_*.csv
            quick_examples/freki_objectives/plots/05_*.png

      - name: Commit generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quick_examples/freki_objectives/results/objective_05_*.csv
          git add quick_examples/freki_objectives/plots/05_*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generate FREKI Objective 5 online monitor outputs'
            git push
          fi
